name: Build Linux
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Bootstrap
        run: |
          apt-get update
          apt-get install -y git ca-certificates

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          missing=""
          for p in clang cmake ninja-build pkg-config python3 \
            libvulkan-dev vulkan-tools libsdl3-dev libfmt-dev libboost-dev \
            libxxhash-dev libzydis-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev \
            libswresample-dev nlohmann-json3-dev libssl-dev zlib1g-dev \
            libminiupnpc-dev libx11-dev glslang-tools spirv-headers libvulkan-memory-allocator-dev \
            mesa-vulkan-drivers python3-tk python3-pil; do
            apt-get install -y "$p" || missing="$missing $p"
          done
          echo "MISSING PACKAGES:$missing"

      - name: Build robin-map from source
        run: |
          git clone --depth 1 --branch v1.3.0 https://github.com/Tessil/robin-map.git /tmp/robin-map
          cmake -S /tmp/robin-map -B /tmp/robin-map/build -DCMAKE_INSTALL_PREFIX=/usr
          cmake --install /tmp/robin-map/build

      - name: Build protobuf from source
        run: |
          git clone --depth 1 --branch v21.12 https://github.com/protocolbuffers/protobuf.git /tmp/protobuf
          cmake -S /tmp/protobuf -B /tmp/protobuf/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/protobuf \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -Dprotobuf_BUILD_TESTS=OFF \
            -Dprotobuf_BUILD_SHARED_LIBS=OFF
          cmake --build /tmp/protobuf/build
          cmake --install /tmp/protobuf/build
          find /opt/protobuf -iname 'protobuf-config.cmake'
          echo "CMAKE_PREFIX_PATH=/opt/protobuf" >> "$GITHUB_ENV"
          echo "/opt/protobuf/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          protoc --version
          BB_LTO=OFF BB_PGO=off bash build.sh

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uncharted-linux-build
          path: |
            out/bb-probe
            out/gpu/libbbgpu.so
            out/gpu-build.log
