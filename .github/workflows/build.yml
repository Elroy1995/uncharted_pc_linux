name: Build Linux
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Bootstrap
        run: |
          apt-get update
          apt-get install -y git ca-certificates

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          missing=""
          for p in clang cmake ninja-build pkg-config python3 \
            libvulkan-dev vulkan-tools libsdl3-dev libfmt-dev libboost-dev \
            libxxhash-dev libzydis-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev \
            libswresample-dev nlohmann-json3-dev libssl-dev zlib1g-dev \
            libminiupnpc-dev libx11-dev glslang-tools spirv-headers libvulkan-memory-allocator-dev \
            mesa-vulkan-drivers python3-tk python3-pil; do
            apt-get install -y "$p" || missing="$missing $p"
          done
          echo "MISSING PACKAGES:$missing"

      - name: Install protobuf (strict)
        run: |
          apt-get install -y libprotobuf-dev protobuf-compiler
          protoc --version
          dpkg -L libprotobuf-dev | grep -i cmake || echo "NO CMAKE FILES IN libprotobuf-dev"

      - name: Build robin-map from source
        run: |
          git clone --depth 1 --branch v1.3.0 https://github.com/Tessil/robin-map.git /tmp/robin-map
          cmake -S /tmp/robin-map -B /tmp/robin-map/build -DCMAKE_INSTALL_PREFIX=/usr
          cmake --install /tmp/robin-map/build

      - name: Build
        run: BB_LTO=OFF BB_PGO=off bash build.sh

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uncharted-linux-build
          path: |
            out/bb-probe
            out/gpu/libbbgpu.so
            out/gpu-build.log
